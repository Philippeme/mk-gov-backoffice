# Admin Routes
admin:
    path: /admin
    controller: App\Controller\Admin\DashboardController::index

admin_dashboard:
    path: /admin/dashboard
    controller: App\Controller\Admin\DashboardController::index

# Requests Routes
admin_requests:
    path: /admin/requests
    controller: App\Controller\Admin\RequestController::index

admin_requests_show:
    path: /admin/requests/{id}
    controller: App\Controller\Admin\RequestController::show
    requirements:
        id: '\d+'

admin_requests_new:
    path: /admin/requests/new
    controller: App\Controller\Admin\RequestController::new

admin_requests_edit:
    path: /admin/requests/{id}/edit
    controller: App\Controller\Admin\RequestController::edit
    requirements:
        id: '\d+'

admin_requests_delete:
    path: /admin/requests/{id}/delete
    controller: App\Controller\Admin\RequestController::delete
    requirements:
        id: '\d+'
    methods: [POST]

